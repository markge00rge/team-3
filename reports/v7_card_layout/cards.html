<!doctype html><html><head><meta charset="utf-8"><style>
    .finance-grid{margin:12px 0 24px;min-width:0;container-type:inline-size;}.finance-main,.finance-materials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px;}.finance-materials{grid-template-columns:repeat(3,minmax(0,1fr));}
    .finance-card{box-sizing:border-box;min-width:0;min-height:145px;background:white;border:1px solid #dce6ee;border-radius:16px;padding:22px;}
    .finance-label{font-size:clamp(.8rem,1.1vw,1rem);font-weight:600;white-space:normal;overflow-wrap:anywhere;line-height:1.4;}
    .finance-value{font-family:Manrope,sans-serif;font-weight:800;font-size:clamp(1.4rem,2.6vw,2.5rem);line-height:1.3;margin-top:14px;white-space:normal;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;}
    .total-card{background:#102f4d;color:white;border-color:#102f4d;}
    @media(max-width:1100px){.finance-materials{grid-template-columns:minmax(0,1fr);}}
    @media(max-width:700px){.finance-main{grid-template-columns:minmax(0,1fr);}.finance-card{min-height:125px;}}
    @container(max-width:650px){.finance-main,.finance-materials{grid-template-columns:minmax(0,1fr);}}
    [data-testid="stMetricValue"]{font-size:clamp(1rem,1.8vw,1.9rem)!important;white-space:normal!important;overflow-wrap:anywhere;}
    [data-testid="stMetricLabel"]{white-space:normal!important;overflow-wrap:anywhere;}
    </style><style>body{margin:0;background:#f4f7fb;font-family:Arial;}main{margin-left:280px;padding:24px;max-width:1450px;box-sizing:border-box;}pre{white-space:pre-wrap;overflow-wrap:anywhere;}</style></head><body><main><div class="finance-grid"><div class="finance-main"><section class="finance-card" data-finance-key="operating_expenses" title="Full operating costs including IDE less the disclosed new-A scrap overlap. Exact unrounded USD: 1234567890123.125"><div class="finance-label">Operating Expenses — Excluding Material Purchases</div><div class="finance-value" style="font-size:clamp(14px,2.4vw,20.48px)">$1,234,567,890,123.12</div></section><section class="finance-card total-card" data-finance-key="total_delivery_cost" title="Modeled supply chain planning cost including specified material expenses; not transportation expense alone. Exact unrounded USD: 1.234567890123e+18"><div class="finance-label">TOTAL DELIVERY COST</div><div class="finance-value" style="font-size:clamp(14px,2.4vw,14.83px)">$1,234,567,890,123,000,064.00</div></section></div><div class="finance-materials"><section class="finance-card" data-finance-key="a_materials" title="New A RM/PM orders only, charged at placement. Exact unrounded USD: 123456789.125"><div class="finance-label">Additional Product A Material Cost</div><div class="finance-value" style="font-size:clamp(14px,2.4vw,36.00px)">$123.46M</div></section><section class="finance-card" data-finance-key="c_materials" title="New C RM/PM orders only, charged at placement. Exact unrounded USD: 12345678.123456"><div class="finance-label">Additional Product C Material Cost</div><div class="finance-value" style="font-size:clamp(14px,2.4vw,36.00px)">$12.35M</div></section><section class="finance-card" data-finance-key="b_materials" title="Additional Product B RM and PM purchase orders only, charged at placement. No expense on consumption or receipt. Exact unrounded USD: 950000.0"><div class="finance-label">Additional Product B Material Cost</div><div class="finance-value" style="font-size:clamp(14px,2.4vw,36.00px)">$950,000</div></section></div></div><pre id="audit"></pre></main><script>
    const violations=[];for(const el of document.querySelectorAll('.finance-card,.finance-label,.finance-value')){
    const b=el.getBoundingClientRect(),p=el.parentElement.getBoundingClientRect();
    if(el.scrollWidth>el.clientWidth+1||b.left<p.left-1||b.right>p.right+1)violations.push(el.className);}
    const result={width:innerWidth,cards:document.querySelectorAll('.finance-card').length,
    violations:violations,pageOverflow:document.documentElement.scrollWidth>innerWidth+1};
    document.getElementById('audit').textContent=JSON.stringify(result);
    </script></body></html>
